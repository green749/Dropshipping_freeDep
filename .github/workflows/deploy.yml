name: CI/CD Pipeline - Render & Vercel Deployment

on:
  push:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Backend Docker Image & Push to Docker Hub
  # -------------------------------------------------------------
  build-and-push-backend:
    name: 🐳 Build & Push Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/dropship-backend:latest

  # -------------------------------------------------------------
  # Job 2: Trigger Automatic Deployment on Render
  # -------------------------------------------------------------
  deploy-to-render:
    name: 🚀 Deploy Backend to Render
    needs: build-and-push-backend
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "📡 Triggering Render Deployment..."
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "✅ Render deployment triggered successfully!"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_URL secret not set. Render will auto-deploy via GitHub push."
          fi

  # -------------------------------------------------------------
  # Job 3: Build & Deploy Frontend to Vercel
  # -------------------------------------------------------------
  deploy-to-vercel:
    name: ⚡ Deploy Frontend to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
