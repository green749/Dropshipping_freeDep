services:
  # Backend Web Service (API Gateway & Microservices)
  - type: web
    name: dropship-backend-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORCE_SEED
        value: "true"
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromDatabase:
          name: dropship-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dropship-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dropship-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: dropship-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dropship-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

databases:
  # Managed PostgreSQL Database on Render
  - name: dropship-postgres
    databaseName: dropship_management
    user: dropship_user
    plan: free
